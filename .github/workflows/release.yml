name: Publier la release v1.0.0

on:
  workflow_dispatch:
  push:
    branches: ['arena/e83fd17f-grand-three-auto']
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la compilation source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/44751557768 > run.json
          jq -e '.conclusion == "success" and .head_sha == "1e7993a2e2862a6d6b9eb6f833d5c8aa6d0dcf5d"' run.json
      - name: Récupérer le jeu Windows compilé
        uses: actions/download-artifact@v4
        with:
          name: Pacific-Drive-Windows-x64
          path: release
          run-id: 44751557768
          github-token: ${{ github.token }}
      - name: Vérifier les fichiers et publier
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          sed -i '1s/^\xEF\xBB\xBF//; s/\r$//' SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat > ../notes.md <<'EOF'
          ## Pacific Drive — premier prototype jouable

          Jeu original de conduite et d’exploration en 3D : ville, circulation, mini-carte et missions de rendez-vous.

          ### Jouer sur Windows
          Téléchargez **Pacific-Drive-1.0.0-Windows-x64.exe** ci-dessous et lancez-le sur Windows 10/11 64 bits. Aucun serveur, Node.js ou droit administrateur requis.

          **Commandes :** ZQSD / WASD / flèches : bouger · E : entrer/sortir du véhicule · Espace : freiner · C : caméra · Échap : pause.

          ### Sécurité
          Version de développement non signée : Windows Defender ou SmartScreen peuvent afficher un avertissement. Aucune absence d’alerte n’est garantie ; ne désactivez pas les protections Windows. Le fichier SHA256SUMS.txt permet de vérifier l’intégrité du téléchargement, mais ne constitue pas une signature numérique.

          ### Limites
          Prototype sans sauvegarde, multijoueur, combats, intérieurs ou audio. Accélération graphique nécessaire. Pas encore de test manuel du jeu sous Windows.
          EOF
          gh release create v1.0.0 ./*.exe SHA256SUMS.txt --target 1e7993a2e2862a6d6b9eb6f833d5c8aa6d0dcf5d --title "Pacific Drive v1.0.0 — Prototype Windows" --notes-file ../notes.md --prerelease
