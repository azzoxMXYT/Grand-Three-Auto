name: Version Windows

on:
  push:
    branches: ['arena/e83fd17f-grand-three-auto', 'main']
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      publish:
        description: Publier la préversion v1.2.0
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  graphics-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p release
      - run: npm run dev > /tmp/vite.log 2>&1 &
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Graphics-smoke
          path: release/graphics-smoke.png
  windows:
    needs: graphics-smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compiler le jeu Windows x64
        shell: pwsh
        run: |
          $output = & npm run dist:win 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $message = (($output | Select-Object -Last 65) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$message"
            exit $code
          }
      - name: Calculer la somme de contrôle SHA-256
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "release/SHA256SUMS.txt" -Encoding utf8 -Append
          }
      - name: Publier le téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: Pacific-Drive-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publier la préversion v1.2.0
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Pacific Drive — graphismes et installation Windows
          - Installateur Windows par utilisateur : choix du dossier, raccourcis bureau et menu Démarrer, désinstallation standard.
          - Version portable également disponible, sans installation.
          - Ciel atmosphérique, eau animée, peinture de carrosserie et vitres avec reflets d’environnement précalculés, asphalte texturé, végétation retravaillée, enseignes et mobilier côtier.
          - Bouton de qualité Élevée / Performance pour adapter le rendu à votre PC.
          - Conduite, exploration à pied, manettes standard, pistolet/carabine et cibles d’entraînement conservés. Échap pour les commandes.

          Téléchargez le fichier **Installation-x64.exe** pour installer le jeu, ou **Portable-x64.exe** pour le lancer sans installation. Windows 10/11 x64 avec accélération graphique requis. Tous les assets sont inclus.

          Prototype original stylisé : ce n’est pas un jeu complet ou photoréaliste de l’ampleur de GTA V. Pas de sauvegarde, combats contre des PNJ, intérieurs ou multijoueur.

          **Sécurité :** exécutables non signés. Defender, SmartScreen ou une politique administrateur peuvent toujours bloquer leur lancement. Ce nouvel emballage ne supprime pas ces restrictions et ne désactive aucune protection. Pas de garantie d’absence d’alerte. Ne désactivez pas les protections Windows.

          Tests automatisés du rendu WebGL, du tir et du changement de qualité avant compilation ; pas de validation manuelle sur Windows ni avec une manette physique.
          NOTES
          gh release create v1.2.0 release/*.exe release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Pacific Drive v1.2.0 — Graphismes et installateur Windows" --notes-file notes.md --prerelease
